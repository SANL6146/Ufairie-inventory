<title>悠小仙产品库存</title>
<style>

/* === 全局 === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B7B95;--primary-dark:#4A6A82;--primary-soft:#EDF1F5;
  --accent:#D4826A;--accent-soft:#FAEEE8;
  --success:#5B7B95;--warning:#C49A5C;--danger:#C0504C;
  --bg:#F5F0E8;--card:#FFFFFF;--card-alt:#2C3E50;--text:#2A2A2A;--t2:#8C8C8C;--t3:#B8B8B8;--border:#E8E0D5;
  --radius:12px;--radius-sm:8px;--shadow:none;--shadow-sm:none;--sb:env(safe-area-inset-bottom,16px);
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;gap:6px;transition:all .15s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--primary);color:#fff;font-weight:700}
.btn-s{background:var(--bg);color:var(--t2);border:1px solid var(--border)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:6px}
.btn-b{width:100%}
.btn-icon{background:none;border:none;font-size:18px;cursor:pointer;padding:6px;border-radius:6px;line-height:1}
.btn-icon:active{background:var(--border)}
.hidden{display:none!important}
.empty{text-align:center;padding:60px 20px;color:var(--t3);font-size:15px}

/* === 顶部 logo 区 === */
.brand-hero{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;background:var(--card)}
.brand-logo{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0}
.brand-name-l{font-size:17px;font-weight:800;letter-spacing:.5px;color:var(--text)}

/* === Tab Bar === */
.tab-bar{display:flex;gap:0;padding:0 16px;background:var(--card);border-bottom:1px solid var(--border)}
.tab-item{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:600;color:var(--t2);cursor:pointer;position:relative;transition:color .15s}
.tab-item.active{color:var(--primary)}
.tab-item.active::after{content:'';position:absolute;bottom:-1px;left:25%;right:25%;height:2px;background:var(--primary);border-radius:1px}

/* === 头部 === */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.header-l{width:36px;display:flex;align-items:center;gap:6px}
.header-t{flex:1;font-size:17px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.header-r{width:36px;display:flex;gap:2px;align-items:center;justify-content:flex-end}
.btn-back{background:none;border:none;font-size:18px;cursor:pointer;padding:4px 6px;color:var(--text)}

/* === 视图 === */
.main{padding-bottom:calc(80px + var(--sb))}
.view{display:none}
.view.active{display:block;animation:pageIn .35s cubic-bezier(.4,0,.2,1)}

/* === 统计条 === */
.stats{display:flex;gap:8px;padding:10px 14px 12px;background:transparent}
.stats-i{flex:1;text-align:center;padding:14px 6px;border-radius:var(--radius);background:var(--card);border:1px solid var(--border)}
.stats-i.warn{background:#FAF3E8}
.stats-i.warn .stats-n{color:var(--warning)}
.stats-i.danger{background:#FAF0EE}
.stats-i.danger .stats-n{color:var(--danger)}
.stats-n{display:block;font-size:22px;font-weight:800;color:var(--primary-dark)}
.stats-l{display:block;font-size:11px;color:var(--t2);margin-top:2px}

/* === 分区标题 === */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 10px}
.sec-head h2{font-size:17px;font-weight:800}
.sec-head .btn{padding:6px 12px;font-size:12px;border-radius:6px}

/* === 产品目录入口 === */
.catalog-entry{margin:0 14px 10px;background:var(--card);border-radius:var(--radius);padding:20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;color:var(--text);border:1px solid var(--border)}
.catalog-entry:active{transform:scale(.98)}
.catalog-entry-icon{width:48px;height:48px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.catalog-entry-body{flex:1;min-width:0}
.catalog-entry-title{font-size:16px;font-weight:700}
.catalog-entry-sub{font-size:12px;color:var(--t2);margin-top:2px}
.catalog-entry-arrow{font-size:20px;color:var(--t3)}

/* === 门店卡片（2列网格） === */
.store-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.store-card{background:var(--card);border-radius:var(--radius);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;border:1px solid var(--border)}
.store-card:active{transform:scale(.98)}
.store-avatar{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.store-info{flex:1;min-width:0;text-align:center;width:100%}
.store-name{font-size:14px;font-weight:700;text-align:center}
.store-meta{font-size:11px;color:var(--t2);margin-top:2px;text-align:center}
.store-qty{text-align:center;min-width:40px}
.store-qty-n{font-size:18px;font-weight:800;color:var(--primary-dark);line-height:1.1}
.store-qty-u{font-size:10px;color:var(--t2)}
.store-arrow{display:none}
.store-card .store-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.store-tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.store-tag.warn{background:#FAF3E8;color:var(--warning)}
.store-tag.danger{background:#FAF0EE;color:var(--danger)}

/* === 品牌卡片（2列网格） === */
.brand-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.brand-card{background:var(--card);border-radius:var(--radius);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;border:1px solid var(--border)}
.brand-card:active{transform:scale(.98)}
.brand-avatar{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.brand-info{flex:1;min-width:0;text-align:center;width:100%}
.brand-name{font-size:14px;font-weight:700;text-align:center}
.brand-meta{font-size:11px;color:var(--t2);margin-top:2px;text-align:center}
.brand-qty{font-size:13px;color:var(--t2);white-space:nowrap}
.brand-avatar-img{width:48px;height:48px;border-radius:12px;object-fit:cover;flex-shrink:0}
.brand-actions{display:flex;gap:4px;flex-shrink:0;justify-content:center}
.brand-actions .btn-icon{font-size:14px;padding:4px;color:var(--t3)}

/* === 产品卡片（2列网格） === */
.prod-list{padding:0 14px}
#catProdList{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px}
.store-prod-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.store-prod-group-title{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--t2);padding:6px 0}
.prod-card{background:var(--card);border-radius:var(--radius);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s;border:1px solid var(--border)}
.prod-card:active{transform:scale(.98)}
.prod-thumb{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;object-fit:cover}
.pa-精华{background:#E8DEF5}.pa-面霜{background:#F5E6D3}.pa-眼霜{background:#D5E8D3}
.pa-水{background:#D3E0F5}.pa-乳液{background:#F5D3E8}.pa-洁面{background:#D3F0F5}
.pa-面膜{background:#E0D5F5}.pa-防晒{background:#F5F0D3}.pa-其他{background:#E8E3DB}
.prod-info{flex:1;min-width:0;text-align:center;width:100%}
.prod-name{font-size:13px;font-weight:600;text-align:center}
.prod-meta{font-size:11px;color:var(--t2);margin-top:1px;text-align:center}
.prod-expiry{font-size:11px;color:var(--danger);margin-top:1px;text-align:center}
.prod-expiry.ok{color:var(--t3)}
.prod-qty{text-align:center;min-width:40px}
.prod-qty-n{font-size:18px;font-weight:800;line-height:1.2}
.prod-qty-n.low{color:var(--warning)}.prod-qty-n.normal{color:var(--primary-dark)}
.prod-qty-u{font-size:10px;color:var(--t2)}
.prod-acts{display:flex;gap:4px;margin-top:4px;justify-content:center;flex-wrap:wrap}
.prod-acts .btn{font-size:11px;padding:4px 8px}

/* === 图片上传 === */
.img-upload{position:relative;border:2px dashed var(--border);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;transition:.2s;min-height:80px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card)}
.img-upload:hover{border-color:var(--primary)}
.img-upload img{max-width:100%;max-height:180px;border-radius:8px;object-fit:contain}
.img-upload .img-placeholder{color:var(--t3);font-size:13px}
.img-upload-actions{display:flex;gap:6px;margin-top:6px;justify-content:center}
.img-upload-actions .btn{font-size:11px;padding:4px 10px}

/* === 搜索筛选 === */
.search{background:var(--card);padding:12px 14px;border-bottom:1px solid var(--border)}
.search-wrap{display:flex;align-items:center;background:#F0EBE0;border-radius:8px;padding:0 10px;gap:6px}
.search-wrap input{flex:1;border:none;background:none;padding:9px 0;font-size:14px;outline:none;color:var(--text)}
.search-wrap input::placeholder{color:var(--t3)}
.s-icon{font-size:14px;opacity:.5}
.s-clear{background:none;border:none;color:var(--t3);font-size:13px;cursor:pointer;padding:4px}
.filter-row{display:flex;gap:6px;margin-top:8px}
.filter-row select{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--card);color:var(--text);outline:none}

/* === 详情 === */
.detail-wrap{padding:16px 14px}
.detail-hero{text-align:center;padding:24px 14px;background:var(--primary-soft);border-radius:var(--radius);border:1px solid var(--border)}
.d-hero-img{width:100%;max-width:300px;max-height:220px;object-fit:contain;border-radius:var(--radius);margin-bottom:10px}
.d-avatar{width:56px;height:56px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px;background:var(--primary-soft);color:var(--primary)}
.d-name{font-size:18px;font-weight:800}
.d-brand{font-size:13px;color:var(--t2)}
.d-qty-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.d-qty-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--primary);background:#fff;color:var(--primary);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:all .15s}
.d-qty-btn:active{background:var(--primary);color:#fff}
.d-qty-val{font-size:28px;font-weight:800;min-width:50px;text-align:center}
.d-info{background:var(--card);border-radius:var(--radius);margin-top:12px;padding:14px 16px;border:1px solid var(--border)}
.d-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.d-row:last-child{border:none}
.d-label{color:var(--t2)}.d-value{font-weight:500}.d-value.warn{color:var(--danger)}
.d-actions{display:flex;gap:10px;padding:14px 14px 20px}
.d-actions .btn{flex:1}

/* === 批次列表 === */
.batch-section{margin-top:10px}
.batch-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.batch-head h3{font-size:15px;font-weight:600}
.batch-card{background:var(--card);border-radius:var(--radius);padding:14px;margin:8px 14px;border:1px solid var(--border)}
.batch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.batch-no{font-weight:700;font-size:13px}
.batch-expiry{font-size:11px;padding:2px 8px;border-radius:20px}
.batch-expiry.warn{background:#FAF0EE;color:var(--danger)}
.batch-expiry.ok{background:var(--primary-soft);color:var(--primary-dark)}
.batch-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.batch-info span{color:var(--t2)}
.batch-info strong{color:var(--text)}
.batch-acts{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}

/* === Fab === */
.fab{position:fixed;bottom:calc(24px + var(--sb));right:16px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;font-size:26px;border:none;box-shadow:0 4px 12px rgba(91,123,149,.25);cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;transition:all .2s}
.fab:active{transform:scale(.9)}

/* === 弹窗 === */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;animation:fIn .25s;touch-action:none;overscroll-behavior:contain}
.modal{background:var(--card);width:100%;border-radius:12px 12px 0 0;min-height:50vh;max-height:88vh;overflow-y:auto;padding-bottom:var(--sb);animation:sUp .3s;overscroll-behavior:contain}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:16px}.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3);padding:4px}
.modal-b{padding:18px}

/* === 表单 === */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px}
.fg label .req{color:var(--danger)}
.fg input,.fg select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card);color:var(--text);outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,123,149,.12)}
.fr{display:flex;gap:8px}.f1{flex:1}
.fa{display:flex;gap:8px;margin-top:18px}.fa .btn{flex:1;padding:11px;font-size:14px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle-row label{font-size:13px;font-weight:600;color:var(--text)}
.toggle-row .hint{font-size:11px;color:var(--t3);margin-top:2px}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#D5D0C8;border-radius:24px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:var(--primary)}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px)}

/* === 记录 === */
.section-head{padding:18px 14px 10px}.section-head h2{font-size:17px;font-weight:800}
.tx-list{padding:0 14px}
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;background:var(--card);border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)}
.tx-badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.tx-badge.in{background:var(--primary-soft);color:var(--primary-dark)}.tx-badge.out{background:#FAF0EE;color:var(--danger)}
.tx-info{flex:1}.tx-prod{font-weight:600}.tx-meta{font-size:11px;color:var(--t2)}.tx-time{font-size:10px;color:var(--t3);white-space:nowrap}

/* === Toast === */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.12);animation:fIn .25s;max-width:80vw;text-align:center}
.toast.error{background:var(--danger)}.toast.success{background:var(--primary-dark)}

/* === 密码弹窗 === */
.pw-dialog{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;display:flex;align-items:center;justify-content:center;animation:fIn .2s}
.pw-box{background:var(--card);border-radius:var(--radius);padding:28px 24px;width:300px;border:1px solid var(--border)}
.pw-box h3{font-size:16px;margin-bottom:4px}
.pw-box p{font-size:12px;color:var(--t2);margin-bottom:14px}
.pw-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;outline:none}
.pw-box input:focus{border-color:var(--primary)}
.pw-acts{display:flex;gap:8px;margin-top:14px}
.pw-acts .btn{flex:1;padding:10px;font-size:13px}

/* === 设置页 === */
.settings-wrap{padding:16px}
.set-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;border:1px solid var(--border)}
.set-card h3{font-size:15px;margin-bottom:10px}
.set-card .fg{margin-bottom:10px}
.set-card .set-hint{font-size:10px;color:var(--t2);display:block;margin-top:4px}
.set-card .set-toggle{font-size:13px;color:var(--text);cursor:pointer}

/* === 产品下拉选择器 === */
.prod-select-group{font-weight:600;color:var(--text);padding:4px 0;font-size:12px}
.prod-select-group option{font-weight:400;font-size:14px;padding-left:8px}

@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* === 深色区域 === */
.dark-section{background:var(--card-alt);color:#fff;border-radius:var(--radius);padding:20px 16px;margin:0 14px 10px}
.dark-section .stats-n{color:#fff}
.dark-section .stats-l{color:rgba(255,255,255,.6)}
.dark-section .stats-i{background:rgba(255,255,255,.08);border:none}

@media(min-width:768px){
  body{background:#EDE7DD}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.04)}
  .fab{right:calc(50% - 210px)}
}

</style>
</head>
<body>
<div id="app">
<header class="header">
  <div class="header-l">
    <button class="btn-back hidden" id="btnBack">←</button>
  </div>
  <h1 class="header-t" id="headerTitle"></h1>
  <div class="header-r">
    <button class="btn-icon" onclick="Pages.settings()" title="设置">⚙️</button>
  </div>
</header>

<main class="main">
  <!-- 首页：品牌区 + 统计 + 门店 -->
  <div id="v-stores" class="view active">
    <div class="brand-hero">
      <div class="brand-logo">悠</div>
      <div class="brand-name-l">悠小仙</div>
    </div>
    <div class="tab-bar">
      <div class="tab-item active" onclick="Pages.loadHome()">首页</div>
      <div class="tab-item" onclick="Pages.openCatalogHome()">目录</div>
      <div class="tab-item" onclick="Pages.loadAllTxs()">记录</div>
    </div>
    <div class="stats">
      <div class="stats-i"><span class="stats-n" id="sBrands">--</span><span class="stats-l">品牌</span></div>
      <div class="stats-i"><span class="stats-n" id="sTotal">--</span><span class="stats-l">产品</span></div>
      <div class="stats-i warn"><span class="stats-n" id="sLow">--</span><span class="stats-l">库存不足</span></div>
      <div class="stats-i danger"><span class="stats-n" id="sExpiry">--</span><span class="stats-l">临期批次</span></div>
    </div>

    <!-- 产品目录入口 -->
    <div class="catalog-entry" onclick="Pages.openCatalogHome()">
      <div class="catalog-entry-icon">📦</div>
      <div class="catalog-entry-body">
        <div class="catalog-entry-title">产品目录</div>
        <div class="catalog-entry-sub">管理品牌和产品基础信息</div>
      </div>
      <div class="catalog-entry-arrow">›</div>
    </div>

    <!-- 数据看板入口 -->
    <div class="catalog-entry" onclick="Pages.openDashboard()" style="background:var(--card);color:var(--text)">
      <div class="catalog-entry-icon" style="background:var(--bg);color:var(--primary)">📊</div>
      <div class="catalog-entry-body">
        <div class="catalog-entry-title" style="color:var(--text)">数据看板</div>
        <div class="catalog-entry-sub" style="color:var(--t2)">库存价值分析</div>
      </div>
      <div class="catalog-entry-arrow" style="color:var(--t3)">›</div>
    </div>

    <!-- 门店区 -->
    <div class="store-list" id="storeList"><div class="empty">加载中…</div></div>
    <button class="fab hidden" id="fabHome" onclick="Pages.storeForm()">+</button>
  </div>

  <!-- 产品目录 → 品牌列表 -->
  <div id="v-catalog-brands" class="view">
    <div class="sec-head">
      <h2>📦 品牌目录</h2>
      <button class="btn btn-sm btn-p" onclick="Pages.brandForm()">＋ 添加品牌</button>
    </div>
    <div class="brand-list" id="catalogBrandList"><div class="empty">暂无品牌</div></div>
  </div>

  <!-- 产品目录 → 品牌产品列表 -->
  <div id="v-catalog" class="view">
    <div class="search">
      <div class="search-wrap">
        <span class="s-icon">🔍</span>
        <input type="text" id="catSearch" placeholder="搜索产品…" oninput="Pages.catSearch()">
        <button class="s-clear hidden" id="catSClear" onclick="Pages.catClearSearch()">✕</button>
      </div>
    </div>
    <div class="prod-list" id="catProdList"><div class="empty">暂无产品</div></div>
    <button class="fab" onclick="Pages.productForm()">+</button>
  </div>

  <!-- 门店产品列表 -->
  <div id="v-storeprods" class="view">
    <div class="prod-list" id="storeProdList"><div class="empty">暂无产品</div></div>
    <button class="fab" onclick="Pages.addProductToStore()">+</button>
  </div>

  <!-- 产品详情（含批次） -->
  <div id="v-detail" class="view">
    <div id="detailContent"></div>
  </div>

  <!-- 数据看板 -->
  <div id="v-dashboard" class="view">
    <div class="detail-wrap" id="dashboardContent"><div class="empty">加载中…</div></div>
  </div>

  <!-- 操作记录 -->
  <div id="v-tx" class="view">
    <div class="section-head"><h2>操作记录</h2></div>
    <div class="tx-list" id="txList"><div class="empty">加载中…</div></div>
  </div>

  <!-- 设置 -->
  <div id="v-settings" class="view">
    <div class="settings-wrap">
      <div class="set-card">
        <h3>☁️ 云端同步</h3>
        <p style="font-size:12px;color:var(--t2);margin-bottom:8px">通过 GitHub 自动同步数据，多设备共享同一份库存</p>
        <div class="fg">
          <label>GitHub Personal Access Token</label>
          <input type="password" id="setGhToken" placeholder="github_pat_...">
          <span class="set-hint">需要 repo 权限。生成路径: GitHub Settings → Developer settings → Personal access tokens → Tokens (classic)</span>
        </div>
        <label class="set-toggle" style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer">
          <input type="checkbox" id="setAutoSync" checked onchange="Settings.saveSync()"> 自动同步
        </label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-s btn-b" onclick="Settings.saveSync()">💾 保存配置</button>
          <button class="btn btn-s btn-b" onclick="Settings.testConn()" id="btnTest">🔍 测试连接</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:0">
          <button class="btn btn-s btn-b" onclick="Settings.pullNow()" id="btnPull">⬇️ 从云端拉取</button>
          <button class="btn btn-s btn-b" onclick="Settings.pushNow()" id="btnPush">⬆️ 推送到云端</button>
        </div>
        <p id="syncMsg" style="font-size:11px;color:var(--t2);margin-top:8px"></p>
      </div>
      <div class="set-card">
        <h3>📊 数据管理</h3>
        <button class="btn btn-s btn-b" style="margin-bottom:8px" onclick="Settings.exportData()">导出全部数据 (JSON)</button>
        <button class="btn btn-s btn-b" style="margin-bottom:8px" onclick="document.getElementById('importFileInput').click()">导入数据 (JSON)</button>
        <input type="file" id="importFileInput" accept=".json" style="display:none" onchange="Settings.importData(this.files[0])">
        <button class="btn btn-d btn-b" onclick="Settings.reset()">重置所有数据</button>
      </div>
    </div>
  </div>
</main>

<!-- 弹窗 -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modal"><div class="modal-h"><h3 id="modalTitle"></h3><button class="modal-close" onclick="UI.closeModal()">✕</button></div><div class="modal-b" id="modalBody"></div></div>
</div>
<div class="toast hidden" id="toast"></div>
</div>

<script>
/* ==================== 数据层 ==================== */
const DB = {
  _load(k){try{return JSON.parse(localStorage.getItem('sk_'+k))||[]}catch{return[]}},
  _save(k,v){localStorage.setItem('sk_'+k,JSON.stringify(v));Sync.autoSync()},
  _nid(k){let n=(parseInt(localStorage.getItem('sk_nid_'+k))||0)+1;localStorage.setItem('sk_nid_'+k,n);return n},

  // === 门店（不变） ===
  stores(){return this._load('stores')},
  saveStores(v){this._save('stores',v)},

  // === 品牌（全局，无store_id） ===
  brands(){return this._load('brands')},
  saveBrands(v){this._save('brands',v)},

  // === 产品（全局） ===
  products(brandId){return this._load('products').filter(p=>p.brand_id==brandId)},
  allProducts(){return this._load('products')},
  saveProducts(v){this._save('products',v)},

  // === 批次（含store_id） ===
  batches(productId,storeId){
    let all=this._load('batches');
    if(productId)all=all.filter(b=>b.product_id==productId);
    if(storeId)all=all.filter(b=>b.store_id==storeId);
    return all;
  },
  allBatches(){return this._load('batches')},
  saveBatches(v){this._save('batches',v)},

  // === 交易记录 ===
  txs(){return this._load('txs')},
  saveTxs(v){this._save('txs',v)},

  // 产品在某门店的总库存
  storeProductQty(productId,storeId){
    return this.batches(productId,storeId).reduce((s,b)=>s+(b.quantity||0),0);
  },
  // 产品全局总库存
  productQty(productId){
    return this.allBatches().filter(b=>b.product_id==productId).reduce((s,b)=>s+(b.quantity||0),0);
  },
  // 产品在某门店的最早到期日
  storeProductEarliestExpiry(productId,storeId){
    const bats=this.batches(productId,storeId).filter(b=>b.expiration_date);
    if(!bats.length)return null;
    bats.sort((a,b)=>a.expiration_date.localeCompare(b.expiration_date));
    return bats[0].expiration_date;
  },
  productEarliestExpiry(productId){
    const bats=this.allBatches().filter(b=>b.product_id==productId&&b.expiration_date);
    if(!bats.length)return null;
    bats.sort((a,b)=>a.expiration_date.localeCompare(b.expiration_date));
    return bats[0].expiration_date;
  },
  isExpiring(dateStr){
    if(!dateStr)return false;
    return (new Date(dateStr)-new Date())/86400000 <= 90;
  },

  // 某门店有哪些产品（有批次的）
  storeProductIds(storeId){
    return [...new Set(this.allBatches().filter(b=>b.store_id==storeId).map(b=>b.product_id))];
  },

  // 全局统计
  stats(){
    const brands=this.brands();
    const products=this.allProducts();
    const batches=this.allBatches();
    const now=new Date();
    const alertStoreIds=new Set(this.stores().filter(s=>s.stock_alert!==false).map(s=>s.id));
    let lowStock=0;
    let nearExpiry=0;
    products.forEach(p=>{
      const qty=batches.filter(b=>b.product_id==p.id&&alertStoreIds.has(b.store_id)).reduce((s,b)=>s+(b.quantity||0),0);
      if(qty<=(p.min_stock||1))lowStock++;
    });
    batches.forEach(b=>{
      if(b.expiration_date&&(new Date(b.expiration_date)-now)/86400000<=90)nearExpiry++;
    });
    return {brandCount:brands.length,total:products.length,lowStock,nearExpiry,storeCount:this.stores().length};
  },

  // 门店统计
  storeStats(storeId){
    const store=this.stores().find(s=>s.id==storeId)||{};
    const pids=this.storeProductIds(storeId);
    const prods=this.allProducts().filter(p=>pids.includes(p.id));
    const bats=this.allBatches().filter(b=>b.store_id==storeId);
    const now=new Date();
    let totalQty=0;
    prods.forEach(p=>{totalQty+=this.storeProductQty(p.id,storeId)});
    let lowStock=store.stock_alert===false?0:prods.filter(p=>this.storeProductQty(p.id,storeId)<=(p.min_stock||1)).length;
    let nearExpiry=bats.filter(b=>b.expiration_date&&(new Date(b.expiration_date)-now)/86400000<=90).length;
    // 按品牌分组
    const brandIds=[...new Set(prods.map(p=>p.brand_id))];
    return {brandCount:brandIds.length,productCount:prods.length,totalQty,lowStock,nearExpiry};
  }
};

/* ==================== 图片压缩 ==================== */
function compressImage(file, maxWidth, quality){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const max=maxWidth||400;
        if(w>max){h=h*max/w;w=max}
        if(h>max){w=w*max/h;h=max}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality||0.6));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ==================== GitHub 云同步 ==================== */
const Sync = {
  REPO:'SANL6146/Ufairie-inventory',
  PATH:'data.json',

  isEnabled(){return !!localStorage.getItem('sk_gh_token')},
  getToken(){return localStorage.getItem('sk_gh_token')||''},
  setToken(t){localStorage.setItem('sk_gh_token',t)},
  isAutoSync(){return localStorage.getItem('sk_gh_auto')!=='0'},
  setAutoSync(v){localStorage.setItem('sk_gh_auto',v?'1':'0')},

  _decodeBase64(str){
    const bin=atob(str);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  },

  async pull(silent){
    const token=this.getToken();
    if(!token)return false;
    try{
      const res=await fetch(`https://api.github.com/repos/${this.REPO}/contents/${this.PATH}`,{
        headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json'}
      });
      if(!res.ok){
        if(res.status===404){if(!silent)UI.toast('云端暂无数据','info');return false}
        throw new Error(`GitHub API: ${res.status}`);
      }
      const j=await res.json();
      const data=JSON.parse(this._decodeBase64(j.content));
      if(data.stores)localStorage.setItem('sk_stores',JSON.stringify(data.stores));
      if(data.brands)localStorage.setItem('sk_brands',JSON.stringify(data.brands));
      if(data.products)localStorage.setItem('sk_products',JSON.stringify(data.products));
      if(data.batches)localStorage.setItem('sk_batches',JSON.stringify(data.batches));
      if(data.txs)localStorage.setItem('sk_txs',JSON.stringify(data.txs));
      if(data.nids){
        Object.entries(data.nids).forEach(([k,v])=>localStorage.setItem('sk_nid_'+k,v));
      }
      if(!silent)UI.toast('已从云端同步最新数据','success');
      return true;
    }catch(e){
      if(!silent){UI.toast('云端同步失败: '+e.message,'error');console.error(e)}
      return false;
    }
  },

  async _encodeBase64(str){
    const enc=new TextEncoder().encode(str);
    let bin='';
    enc.forEach(b=>bin+=String.fromCharCode(b));
    return btoa(bin);
  },

  async push(silent){
    const token=this.getToken();
    if(!token)return false;
    try{
      let sha=null;
      try{
        const getRes=await fetch(`https://api.github.com/repos/${this.REPO}/contents/${this.PATH}`,{
          headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json'}
        });
        if(getRes.ok){const j=await getRes.json();sha=j.sha}
      }catch{}

      const data={
        stores:DB.stores(),brands:DB.brands(),products:DB.allProducts(),batches:DB.allBatches(),txs:DB.txs(),
        nids:{store:localStorage.getItem('sk_nid_store'),brand:localStorage.getItem('sk_nid_brand'),prod:localStorage.getItem('sk_nid_prod'),batch:localStorage.getItem('sk_nid_batch'),tx:localStorage.getItem('sk_nid_tx')},
        synced_at:new Date().toISOString()
      };
      const content=await this._encodeBase64(JSON.stringify(data));
      const body={message:'自动同步',content};
      if(sha)body.sha=sha;

      const res=await fetch(`https://api.github.com/repos/${this.REPO}/contents/${this.PATH}`,{
        method:'PUT',
        headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const ej=await res.json().catch(()=>({}));
        throw new Error(ej.message||'HTTP '+res.status);
      }
      if(!silent)UI.toast('已同步到云端','success');
      return true;
    }catch(e){
      if(!silent){UI.toast('同步失败: '+e.message,'error');console.error('Sync push error:',e)}
      return false;
    }
  },

  _debounce:null,
  autoSync(){
    if(!this.isEnabled()||!this.isAutoSync())return;
    clearTimeout(this._debounce);
    this._debounce=setTimeout(()=>this.push(true),2000);
  }
};

  openStore(id){
    UI.currentStoreId=id;

  _renderStoreProducts(){
    const storeId=UI.currentStoreId;
    const pids=DB.storeProductIds(storeId);
    const prods=DB.allProducts().filter(p=>pids.includes(p.id));
    const brands=DB.brands();
    const container=document.getElementById('storeProdList');

    if(!prods.length){container.innerHTML='<div class="empty" style="padding:80px 20px">此门店暂无产品<br><br>点击右下角 + 从产品目录中添加</div>';return}

    // 按品牌分组
    const grouped={};
    prods.forEach(p=>{
      const brand=brands.find(b=>b.id===p.brand_id);
      const bname=brand?brand.name:'未分类';
      if(!grouped[bname])grouped[bname]=[];
      grouped[bname].push(p);
    });

    const storeObj=DB.stores().find(s=>s.id==storeId)||{};
    const alertOn=storeObj.stock_alert!==false;
    let html='';
    for(const [bname,gprods] of Object.entries(grouped)){
      html+=`<div class="store-prod-group"><div class="store-prod-group-title">${bname}</div>`;
      html+=gprods.map(p=>{
        const qty=DB.storeProductQty(p.id,storeId);
        const qc=(alertOn&&qty<=(p.min_stock||1))?'low':'normal';
        const exp=DB.storeProductEarliestExpiry(p.id,storeId);
        const isExp=exp&&DB.isExpiring(exp);
        const batchCount=DB.batches(p.id,storeId).length;
        const expHtml=exp?`<div class="prod-expiry${isExp?'':' ok'}">📅 ${isExp?'⚠️临期: '+exp:'保质期: '+exp}</div>`:'';
        const thumbHtml=p.image?`<img class="prod-thumb" src="${p.image}" alt="${UI.esc(p.name)}">`:`<div class="prod-thumb ${UI.catClass(p.category)}">${UI.catEmoji(p.category)}</div>`;
        const metaParts=[];
        if(p.specification)metaParts.push(UI.esc(p.specification));
        metaParts.push(batchCount+'个批次');
        const meta=metaParts.join(' · ');

        return `<div class="prod-card" onclick="Pages.showDetail(${p.id})">
          ${thumbHtml}
          <div class="prod-info">
            <div class="prod-name">${UI.esc(p.name)}</div>
            <div class="prod-meta">${meta}</div>${expHtml}
            <div class="prod-acts" onclick="event.stopPropagation()">
              <button class="btn btn-sm btn-p" onclick="Pages.storeQuickTx(${p.id},'out')">出库</button>
              <button class="btn btn-sm btn-s" onclick="Pages.storeQuickTx(${p.id},'in')">入库</button>
            </div>
          </div>
          <div class="prod-qty"><div class="prod-qty-n ${qc}">${qty}</div><div class="prod-qty-u">${UI.esc(p.unit)}</div></div>
        </div>`;
      }).join('');
      html+='</div>';
    }
    container.innerHTML=html;
  },

  // 门店快速出入库
  storeQuickTx(productId,type){
    const storeId=UI.currentStoreId;
    const cb=()=>{
      const p=DB.allProducts().find(x=>x.id==productId);
      if(!p)return;
      const batches=DB.batches(productId,storeId);
      if(type==='out'&&!batches.length){UI.toast('该产品在此门店无库存','error');return}
      let batchOptions=batches.map(b=>{
        const isExp=b.expiration_date&&DB.isExpiring(b.expiration_date);
        return `<option value="${b.id}" ${isExp?'style="color:var(--danger)"':''}>批次${UI.esc(b.batch_no)} | ${UI.fmtDate(b.expiration_date)} | 库存${b.quantity}${p.unit}</option>`;
      }).join('');
      UI.showModal(
        type==='out'?'📤 出库 - '+p.name:'📥 入库 - '+p.name,
        `<div style="text-align:center;margin-bottom:10px;color:var(--t2);font-size:13px">总库存: <strong>${DB.storeProductQty(productId,storeId)}</strong> ${UI.esc(p.unit)}</div>
        ${type==='out'?`<div class="fg"><label>出库批次</label><select id="txBatchId">${batchOptions}</select></div>`:
        `<div class="fg"><label>批次号</label><input type="text" id="txBatchNoNew" placeholder="如：B20260728"></div>
         <div class="fg"><label>生产日期</label><input type="date" id="txProdDate"></div>

            <input type="number" id="txQty" value="1" min="1" inputmode="none" readonly style="width:60px;text-align:center;font-size:20px;font-weight:700;border:none;background:var(--bg);border-radius:8px;padding:6px;pointer-events:none">
            <button type="button" class="d-qty-btn" onclick="let e=document.getElementById('txQty');e.value=parseInt(e.value||1)+1;return false">+</button>
          </div></div>
        <div class="fg"><label>备注</label><input type="text" id="txRemarks" placeholder="选填"></div>
        <button class="btn btn-p btn-b" onclick="Pages.confirmStoreTx(${productId},'${type}',${storeId})">确认${type==='out'?'出库':'入库'}</button>`
      );
    };

  confirmStoreTx(productId,type,storeId){
    const qty=parseInt(document.getElementById('txQty').value)||1;
    const remarks=document.getElementById('txRemarks').value||'';
    let allBatches=DB.allBatches();
    const p=DB.allProducts().find(x=>x.id==productId);

    if(type==='out'){
      const batchId=parseInt(document.getElementById('txBatchId').value);
      const idx=allBatches.findIndex(b=>b.id==batchId);
      if(idx===-1||allBatches[idx].quantity<qty){UI.toast('库存不足','error');return}
      allBatches[idx].quantity-=qty;
    }else{
      const batchNo=document.getElementById('txBatchNoNew').value||('B'+new Date().toISOString().slice(0,10).replace(/-/g,''));
      const prodDate=document.getElementById('txProdDate').value;
      const expDate=document.getElementById('txExpDate').value;
      allBatches.push({
        id:DB._nid('batch'),store_id:storeId,product_id:productId,batch_no:batchNo,
        production_date:prodDate,expiration_date:expDate,
        quantity:qty,purchase_date:new Date().toISOString().slice(0,10),
        remarks:'',created_at:new Date().toISOString()
      });
    }
    DB.saveBatches(allBatches);

    const txs=DB.txs();
    txs.unshift({id:Date.now(),product_id:productId,type,quantity:qty,operator:Auth.isAdmin?'管理员':'用户',remarks,created_at:new Date().toISOString()});
    DB.saveTxs(txs);

    UI.closeModal();
    UI.toast(`${type==='out'?'出':'入'}库 ${qty} ${UI.esc(p?p.unit:'件')}`,'success');
    if(UI.currentView==='detail')Pages.showDetail(productId);
    else Pages._renderStoreProducts();
  },

  pickImage(){
    const input=document.createElement('input');
    input.type='file';input.accept='image/*';
    input.onchange=async(e)=>{
      const file=e.target.files[0];
      if(!file)return;
      if(file.size>5*1024*1024){UI.toast('图片不能超过5MB','error');return}
      UI.toast('压缩中…','');
      const base64=await compressImage(file,400,0.6);
      UI._tempImage=base64;
      const box=document.getElementById('imgUploadBox');
      if(box){
        box.innerHTML=`<img src="${base64}" alt="图片" id="imgPreview">`;
        let actions=box.parentNode.querySelector('.img-upload-actions');
        if(!actions){
          actions=document.createElement('div');actions.className='img-upload-actions';
          actions.innerHTML=`<button type="button" class="btn btn-sm btn-s" onclick="event.stopPropagation();Pages.pickImage()">🔄 更换</button><button type="button" class="btn btn-sm btn-d" onclick="event.stopPropagation();Pages.clearImage()">✕ 删除</button>`;
          box.parentNode.appendChild(actions);
        }
      }
    };
    input.click();
  },

/* ==================== 设置逻辑 ==================== */
const Settings = {
  exportData(){
    const data={stores:DB.stores(),brands:DB.brands(),products:DB.allProducts(),batches:DB.allBatches(),txs:DB.txs(),exported_at:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='护肤品库存备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();
    UI.toast('数据已导出','success');
  },
  importData(file){
    if(!file)return;
    if(!confirm('⚠️ 导入数据会覆盖当前所有数据，建议先导出一份备份。确定导入？'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(!data.brands||!data.products||!data.batches){UI.toast('文件格式不正确','error');return}
        if(data.stores)localStorage.setItem('sk_stores',JSON.stringify(data.stores));
        localStorage.setItem('sk_brands',JSON.stringify(data.brands));
        localStorage.setItem('sk_products',JSON.stringify(data.products));
        localStorage.setItem('sk_batches',JSON.stringify(data.batches));
        if(data.txs)localStorage.setItem('sk_txs',JSON.stringify(data.txs));
        UI.toast('数据已导入，页面即将刷新','success');
        setTimeout(()=>location.reload(),800);
      }catch{UI.toast('文件解析失败','error');}
    };
    reader.readAsText(file);
    document.getElementById('importFileInput').value='';
  },
  reset(){
    if(!confirm('⚠️ 确定重置所有数据？此操作不可恢复！\n\n建议先导出备份。'))return;
    if(confirm('再次确认：删除所有品牌、产品、批次和记录？')){
      ['stores','brands','products','batches','txs'].forEach(k=>localStorage.removeItem('sk_'+k));
      location.reload();
    }
  },
  initSync(){
    const token=Sync.getToken();
    if(token)document.getElementById('setGhToken').value=token;
    document.getElementById('setAutoSync').checked=Sync.isAutoSync();
  },
  saveSync(){
    const token=document.getElementById('setGhToken').value.trim();
    Sync.setToken(token);Sync.setAutoSync(document.getElementById('setAutoSync').checked);
    document.getElementById('syncMsg').textContent=token?'配置已保存 ✅':'配置已保存';
    setTimeout(()=>{document.getElementById('syncMsg').textContent=''},2000);
  },
  async pullNow(){
    if(!Sync.getToken()){UI.toast('请先配置 Token','error');return}
    document.getElementById('syncMsg').textContent='正在从云端拉取…';
    const ok=await Sync.pull(true);
    if(ok){document.getElementById('syncMsg').textContent='拉取成功，页面即将刷新';setTimeout(()=>location.reload(),800);}
    else{document.getElementById('syncMsg').textContent='拉取失败，请先「推送」一次创建云端数据';}
  },
  async pushNow(){
    if(!Sync.getToken()){UI.toast('请先配置 Token','error');return}
    document.getElementById('syncMsg').textContent='正在推送到云端…';
    const ok=await Sync.push(true);
    document.getElementById('syncMsg').textContent=ok?'推送成功 ✅':'推送失败，请打开浏览器控制台查看具体错误';
  },
  async testConn(){
    const token=Sync.getToken();
    if(!token){UI.toast('请先输入 Token','error');return}
    document.getElementById('syncMsg').textContent='正在测试连接…';
    try{
      const res=await fetch('https://api.github.com/user',{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json'}});
      if(res.ok){const u=await res.json();document.getElementById('syncMsg').textContent='连接成功 ✅ — 登录用户: '+u.login;}
      else if(res.status===401){document.getElementById('syncMsg').textContent='Token 无效 ❌';}
      else if(res.status===403){document.getElementById('syncMsg').textContent='Token 权限不足 ❌ — 需勾选 repo 权限';}
      else{document.getElementById('syncMsg').textContent='连接失败 HTTP '+res.status;}
    }catch(e){document.getElementById('syncMsg').textContent='网络错误 — 无法访问 GitHub API';}
  }
};
